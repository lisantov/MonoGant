opencollection: 1.0.0

info:
  name: Hakaton Collection
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ""
      port: ""
      auth:
        username: ""
        password: ""
      bypassProxy: ""

request:
  auth:
    type: bearer
    token: "{{token}}"
  variables:
    - name: host
      value: 127.0.0.1:80
    - name: prefix
      value: /api
    - name: token
      value: 1|EViP1fpKgAYFOqsTgFvKi6AZnOptnTbYQUAeuwCP3fbe7de7
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
    presets:
      request:
        type: http
        url: "{{host}}{{prefix}}"
